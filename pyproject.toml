[project]
name = "maria-backend"
version = "4.1.30"
description = "MARIA — Assistente de IA de Escritório, 100% Local"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
]

# `backend` é um namespace package (sem __init__.py na raiz) e nunca é
# instalado como pacote — é executado via `python backend/main.py`.
# package = false faz o uv tratar o projeto como "virtual": gerencia apenas
# as dependências, sem construir/instalar o próprio backend.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Necessário porque `backend` é um namespace package (sem __init__.py na raiz):
# garante que a raiz do monorepo esteja no sys.path (equivale a `python -m pytest`).
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
